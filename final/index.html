<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFinder - Find Restaurants by Food Mood</title>
  <meta name="description" content="Discover restaurants serving the exact food you are craving with ratings, images, and reviews.">
  <meta name="author" content="Caden Griffin">
  <meta property="og:title" content="FoodFinder">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
  <meta property="og:url" content="https://caden-griffin.github.io/wdd231/final/">
  <meta property="og:description" content="Discover restaurants serving the exact food you are craving with ratings, images, and reviews.">
  <meta property="og:image" content="https://caden-griffin.github.io/wdd231/final/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/fork-and-knife" href="images/favicon.png">
  <link rel="stylesheet" href="styles/normalize.css">
  <script type="module" src="scripts/main.js" ></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo">FoodFinder</a>
    <button class="hamburger" id="hamburger">&#9776;</button>
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="add-restaurant.html">Suggest</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>What are you craving today?</h1>
      <p>Search or filter by cuisine to find top-rated local restaurants.</p>
    </section>

    <div class="search-filter-container">
      <input type="text" id="search-input" placeholder="Search by name or keyword...">
      <select id="cuisine-filter">
        <option value="">All Cuisines</option>
        <option value="Italian">Italian</option>
        <option value="Mexican">Mexican</option>
        <option value="Japanese">Japanese</option>
        <option value="Chinese">Chinese</option>
        <option value="American">American</option>
        <option value="Indian">Indian</option>
        <option value="French">French</option>
        <option value="Thai">Thai</option>
        <option value="Greek">Greek</option>
        <option value="Korean">Korean</option>
        <option value="Cuban">Cuban</option>
        <option value="Nepalese">Nepalese</option>
      </select>
    </div>

    <section id="restaurant-grid" class="restaurant-grid">
    </section>
  </main>

  <dialog id="restaurant-modal">
    <div class="modal-content">
      <div class="modal-body"></div>
      <button class="btn modal-close" id="close-modal">Close</button>
    </div>
  </dialog>

  <footer>
    <p>&copy; 2026 FoodFinder | <a href="attributions.html">Attributions</a> | <a href="https://youtu.be/gW3YPt9zsT8" target="_blank">Video Demonstration</a></p>
  </footer>
</body>
</html>
